<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 6 Exam Pro - 2026 Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6E9;
    --paper-line:#DCE3CF;
    --board:#20463A;
    --board-dark:#163329;
    --ink:#2B3A4A;
    --marker-red:#D6493C;
    --pencil-yellow:#F2B705;
    --leaf:#4C8B6B;
    --leaf-light:#D9EEDF;
  }
  *{box-sizing:border-box;}
  body{
    background: var(--board);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    padding: 20px;
    margin: 0;
  }
  .wrap{ max-width:900px; margin:0 auto; }

  /* Header */
  .top-nav{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; flex-wrap:wrap; gap:15px;
  }
  .logo{ color:#fff; font-size:26px; font-weight:800; font-family:'Baloo 2'; }
  .logo span{ font-family:'Caveat'; color:var(--pencil-yellow); font-size:32px; }
  
  .settings-pill{
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    padding: 10px; border-radius: 12px; display: flex; gap: 8px;
  }
  .settings-pill input, .settings-pill select{
    background: #163329; color: #fff; border: 1px solid #4C8B6B;
    padding: 6px; border-radius: 6px; font-size: 13px; outline: none;
  }

  /* Notebook Styling */
  .paper{
    background:var(--paper); border-radius:20px; box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    padding: 40px 40px 40px 70px; position:relative; min-height: 600px;
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 34px, var(--paper-line) 35px);
    background-position: 0 100px;
  }
  .paper::before{
    content:""; position:absolute; left:50px; top:0; bottom:0; width:2px; background: rgba(214,73,60,0.2);
  }
  .rings{
    position:absolute; left:15px; top:30px; bottom:30px; width:25px;
    display:flex; flex-direction:column; justify-content:space-around;
  }
  .rings b{ width:22px; height:22px; background:var(--board-dark); border-radius:50%; box-shadow: inset 0 0 0 6px var(--paper); }

  /* UI Elements */
  .field{ margin-bottom:20px; }
  label{ display:block; font-weight:700; font-size:12px; color:var(--board-dark); margin-bottom:6px; text-transform:uppercase; }
  .box{ width:100%; padding:12px; border-radius:10px; border:2px solid #DCE3CF; font-size:15px; background:white; }
  
  .ch-grid{
    background:white; border:2px solid #DCE3CF; border-radius:10px; padding:15px;
    max-height:200px; overflow-y:auto;
  }
  .ch-item{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #f0f0f0; font-size:14px; }

  .btn-action{
    background:var(--marker-red); color:white; border:none; padding:16px 35px; 
    border-radius:14px; font-size:18px; font-weight:800; cursor:pointer;
    box-shadow: 0 5px 0 #9e3228; font-family:'Baloo 2';
  }
  .btn-action:active{ transform:translateY(3px); box-shadow:none; }
  .btn-action:disabled{ background:#ccc; box-shadow:none; }

  /* Exam Interface */
  .exam-head{ display:flex; justify-content:space-between; align-items:center; border-bottom:2px dashed #DCE3CF; margin-bottom:25px; padding-bottom:10px; }
  .timer{ background:var(--board-dark); color:white; padding:8px 18px; border-radius:30px; font-family:'Baloo 2'; font-size:22px; }
  
  .q-block{ background:white; border:1px solid #ddd; border-radius:15px; padding:25px; margin-bottom:20px; }
  .q-meta{ display:flex; justify-content:space-between; margin-bottom:10px; font-weight:700; color:var(--leaf); }
  .q-text{ font-size:17px; font-weight:600; margin-bottom:15px; line-height:1.5; }
  
  .opt-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .opt-label{ border:1px solid #ddd; padding:12px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:10px; }
  .opt-label:hover{ background:#f9fffb; }

  .hidden{ display:none; }
  .loading { font-weight:bold; color:var(--marker-red); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-nav">
    <div class="logo"><span>Class 6</span> Exam Pro</div>
    <div class="settings-pill">
      <input type="password" id="apiKey" placeholder="Gemini API Key">
      <select id="modelSelect">
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (Latest)</option>
        <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
        <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
        <option value="gemini-3.5-flash">Gemini 3.5 Flash</option>
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
      </select>
      <button style="background:var(--pencil-yellow); border:none; padding:5px 10px; border-radius:5px; cursor:pointer; font-weight:bold;" onclick="saveKey()">Save</button>
    </div>
  </div>

  <!-- START SCREEN -->
  <div id="setupScreen" class="paper">
    <div class="rings"></div>
    <h2 style="font-family:'Baloo 2'; color:var(--board-dark); margin-top:0;">Practice Paper Setup</h2>
    <p style="color:#666; margin-bottom:30px;">Select subject and chapters to generate your 30-mark exam.</p>

    <div class="field">
      <label>Subject</label>
      <select id="subject" class="box" onchange="loadCh()">
        <option value="">-- Select --</option>
        <option value="Mathematics">Mathematics</option>
        <option value="Science">Science</option>
        <option value="English">English</option>
        <option value="Social Science">Social Science</option>
        <option value="Hindi">Hindi</option>
        <option value="Sanskrit">Sanskrit</option>
        <option value="Computer Science">Computer Science</option>
      </select>
    </div>

    <div class="field">
      <label>Chapters</label>
      <div id="chList" class="ch-grid">
        <div style="color:#999; padding:10px;">Select a subject first...</div>
      </div>
    </div>

    <button id="genBtn" class="btn-action" onclick="generate()">Generate Exam</button>
    <div id="status" style="margin-top:15px;"></div>
  </div>

  <!-- EXAM SCREEN -->
  <div id="examScreen" class="paper hidden">
    <div class="rings"></div>
    <div class="exam-head">
      <div>
        <h2 id="exSub" style="margin:0; font-family:'Baloo 2';">Subject</h2>
        <span style="font-size:12px; color:#666;">Class 6 Syllabus · Total Marks: 30</span>
      </div>
      <div id="timer" class="timer">30:00</div>
    </div>
    <div id="qContainer"></div>
    <div style="text-align:center; margin-top:20px;">
      <button class="btn-action" onclick="finish()">Submit Answers</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="paper hidden">
    <div class="rings"></div>
    <div style="background:var(--leaf); color:white; padding:30px; border-radius:15px; text-align:center;">
      <div style="font-size:18px;">Examination Result</div>
      <div id="scoreBox" style="font-size:50px; font-weight:800; font-family:'Baloo 2';">0/30</div>
    </div>
    <div id="summary" style="margin-top:25px;"></div>
    <button class="btn-action" style="width:100%; margin-top:20px;" onclick="location.reload()">Start New Paper</button>
  </div>
</div>

<script>
const DATA = {
  "Mathematics": ["Patterns in Math", "Lines and Angles", "Number Play", "Data Handling", "Prime Time", "Perimeter and Area", "Fractions", "Symmetry"],
  "Science": ["Living World", "Magnets", "Motion & Measurement", "Materials", "Temperature", "States of Water", "Separation", "Healthy Body"],
  "English": ["Nouns", "Tenses", "Voice", "Comprehension", "Sentence Kinds", "Adverbs", "Modals"],
  "Social Science": ["Earth & Solar System", "Civilization", "Democracy", "Local Govt", "Unity in Diversity", "History Timeline"],
  "Hindi": ["चिड़िया और चुरुन्गुन", "गौरा", "अनारको", "व्याकरण - संज्ञा", "मुहावरे"],
  "Sanskrit": ["संस्कृत-वर्णमाला", "शब्द-परिचयः", "धातु-परिचयः", "प्रार्थना"],
  "Computer Science": ["Excel", "Python", "HTML", "Cloud Apps", "Cyber Security", "AI Basics"]
};

let exam = [];
let answers = {};
let time = 1800;
let tInterval;

function saveKey() {
  localStorage.setItem('g_key', document.getElementById('apiKey').value);
  alert("Saved!");
}

window.onload = () => {
  const k = localStorage.getItem('g_key');
  if(k) document.getElementById('apiKey').value = k;
  document.querySelectorAll('.rings').forEach(r => { for(let i=0; i<12; i++) r.innerHTML += '<b></b>'; });
};

function loadCh() {
  const s = document.getElementById('subject').value;
  const list = document.getElementById('chList');
  list.innerHTML = "";
  if(!s) return;
  DATA[s].forEach(c => {
    list.innerHTML += `<div class="ch-item"><input type="checkbox" class="ch-tick" value="${c}"> <span>${c}</span></div>`;
  });
}

async function generate() {
  const key = document.getElementById('apiKey').value;
  const sub = document.getElementById('subject').value;
  const mod = document.getElementById('modelSelect').value;
  const chs = Array.from(document.querySelectorAll('.ch-tick:checked')).map(t => t.value);

  if(!key || !sub || chs.length === 0) return alert("Fill all details!");

  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  document.getElementById('status').innerHTML = `<span class="loading">Generating 30-Mark Paper using ${mod}...</span>`;

  const prompt = `
    Subject: Class 6 ${sub}. 
    Chapters: ${chs.join(", ")}.
    
    EXAM BLUEPRINT:
    - TOTAL MARKS: Exactly 30.
    - STRUCTURE: Minimum 12 questions, Maximum 18.
    - Part 1: 10 MCQs (1 Mark each)
    - Part 2: 5 One-word/Fill-in-blanks (1 Mark each)
    - Part 3: 3 Short Answers (3 Marks each)
    - Part 4: 1 Long Answer (6 Marks)
    
    MATH RULE: For Mathematics, use clear text. No single-question papers.
    Return ONLY a JSON array: [{"id":1,"type":"mcq","question":"...","options":["..."],"answer":"...","marks":1}]
  `;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${mod}:generateContent?key=${key}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        contents: [{parts: [{text: prompt}]}],
        generationConfig: { responseMimeType: "application/json", temperature: 0.7 }
      })
    });

    const d = await res.json();
    exam = JSON.parse(d.candidates[0].content.parts[0].text);
    start(sub);
  } catch (e) {
    document.getElementById('status').innerHTML = "Error: Model unavailable or key invalid.";
    btn.disabled = false;
  }
}

function start(sub) {
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('examScreen').classList.remove('hidden');
  document.getElementById('exSub').innerText = sub;
  
  const cont = document.getElementById('qContainer');
  cont.innerHTML = "";

  exam.forEach((q, i) => {
    const div = document.createElement('div');
    div.className = "q-block";
    div.innerHTML = `
      <div class="q-meta"><span>Question ${i+1}</span> <span>${q.marks} Mark(s)</span></div>
      <div class="q-text">${q.question}</div>
      <div id="ans-${q.id}"></div>
    `;
    cont.appendChild(div);

    const aArea = document.getElementById(`ans-${q.id}`);
    if(q.type === 'mcq') {
      const g = document.createElement('div');
      g.className = "opt-grid";
      q.options.forEach(o => {
        g.innerHTML += `<label class="opt-label"><input type="radio" name="q${q.id}" value="${o}" onchange="ans(${q.id},'${o}')">${o}</label>`;
      });
      aArea.appendChild(g);
    } else {
      aArea.innerHTML = `<input type="text" class="box" placeholder="Your answer..." oninput="ans(${q.id},this.value)">`;
    }
  });

  tInterval = setInterval(() => {
    time--;
    let m = Math.floor(time/60), s = time%60;
    document.getElementById('timer').innerText = `${m}:${s<10?'0'+s:s}`;
    if(time<=0) finish();
  }, 1000);
}

function ans(id, v) { answers[id] = v; }

function finish() {
  clearInterval(tInterval);
  document.getElementById('examScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');

  let score = 0;
  const sum = document.getElementById('summary');
  sum.innerHTML = "";

  exam.forEach(q => {
    const u = (answers[q.id] || "").trim().toLowerCase();
    const c = String(q.answer).trim().toLowerCase();
    let correct = false;

    if(q.marks === 1) {
       if(u === c) { score += 1; correct = true; }
    } else {
       if(u.length > 10) { score += q.marks; correct = true; } // Descriptive credit
    }

    sum.innerHTML += `
      <div style="border-bottom:1px solid #eee; padding:10px 0;">
        <div style="font-weight:700;">${q.question}</div>
        <div style="color:${correct?'green':'red'}">Your Ans: ${answers[q.id]||'None'}</div>
        <div style="font-size:12px; color:#666;">Correct: ${q.answer}</div>
      </div>
    `;
  });

  document.getElementById('scoreBox').innerText = `${score}/30`;
}
</script>
</body>
</html>
