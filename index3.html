<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 6 Practice Exam Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6E9;
    --paper-line:#DCE3CF;
    --board:#20463A;
    --board-dark:#163329;
    --ink:#2B3A4A;
    --marker-red:#D6493C;
    --pencil-yellow:#F2B705;
    --leaf:#4C8B6B;
    --leaf-light:#D9EEDF;
  }
  *{box-sizing:border-box;}
  body{
    background: var(--board);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    padding: 20px; margin: 0;
  }
  .wrap{ max-width:950px; margin:0 auto; }

  /* Top Settings Bar */
  .top-bar{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; flex-wrap:wrap; gap:10px;
  }
  .logo{ color:#fff; font-size:26px; font-weight:800; font-family:'Baloo 2'; }
  .logo span{ font-family:'Caveat'; color:var(--pencil-yellow); font-size:32px; }
  
  .settings-box{
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    padding: 10px; border-radius: 12px; display: flex; gap: 8px; align-items:center;
  }
  .settings-box input, .settings-box select{
    background: #163329; color: #fff; border: 1px solid #4C8B6B;
    padding: 6px; border-radius: 6px; font-size: 13px; outline: none;
  }

  /* Notebook Styling */
  .paper-card{
    background:var(--paper); border-radius:20px; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    padding: 40px 40px 40px 75px; position:relative; min-height: 650px;
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 34px, var(--paper-line) 35px);
    background-position: 0 100px;
  }
  .paper-card::before{
    content:""; position:absolute; left:55px; top:0; bottom:0; width:2px; background: rgba(214,73,60,0.2);
  }
  .spiral{
    position:absolute; left:15px; top:30px; bottom:30px; width:30px;
    display:flex; flex-direction:column; justify-content:space-around;
  }
  .spiral b{ width:25px; height:25px; background:var(--board-dark); border-radius:50%; box-shadow: inset 0 0 0 7px var(--paper); }

  /* UI Modules */
  .setup-section h2{ font-family:'Baloo 2'; color:var(--board-dark); margin:0 0 5px; font-size:28px; }
  .setup-section p{ color:#666; margin-bottom:25px; font-size:14px; }
  
  label{ display:block; font-weight:700; font-size:12px; color:var(--board-dark); margin-bottom:6px; text-transform:uppercase; }
  .input-field{ width:100%; padding:12px; border-radius:10px; border:2px solid #DCE3CF; font-size:15px; background:white; outline:none; }
  
  .chapters-scroll{
    background:white; border:2px solid #DCE3CF; border-radius:10px; padding:15px;
    max-height:300px; overflow-y:auto; margin-top:5px;
  }
  .group-title{ font-weight:800; color:var(--leaf); font-size:13px; margin:15px 0 5px; text-transform: uppercase; }
  .group-title:first-child{ margin-top:0; }
  .ch-item{ display:flex; align-items:flex-start; gap:10px; padding:6px 0; border-bottom:1px solid #f2f2f2; font-size:14px; cursor:pointer; }
  .ch-item input{ margin-top:3px; }

  .btn-primary{
    background:var(--marker-red); color:white; border:none; padding:16px 40px; 
    border-radius:14px; font-size:18px; font-weight:800; cursor:pointer;
    box-shadow: 0 5px 0 #9e3228; font-family:'Baloo 2'; transition: 0.2s;
  }
  .btn-primary:active{ transform:translateY(3px); box-shadow:none; }
  .btn-primary:disabled{ background:#bbb; box-shadow:none; cursor:not-allowed; }

  .hidden{ display:none; }
  #statusLog{ margin-top:15px; font-weight:bold; color:var(--board-dark); padding: 10px; border-radius: 8px; }
  .error-box { background: #fee; border: 1px solid #fcc; color: #c00; padding: 10px; font-family: monospace; font-size: 12px; margin-top: 10px; overflow-wrap: break-word; }
</style>
</head>
<body>

<div class="wrap">
  <div class="top-bar">
    <div class="logo"><span>Class 6</span> Practice Pro</div>
    <div class="settings-box">
      <input type="password" id="apiKey" placeholder="Gemini API Key">
      <select id="modelSelect">
        <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
        <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
        <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
        <option value="gemini-1.5-flash">Gemini 1.5 Flash (Legacy)</option>
        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
      </select>
      <button onclick="saveKey()" style="background:var(--pencil-yellow); border:none; padding:6px 12px; border-radius:6px; font-weight:bold; cursor:pointer;">Save</button>
    </div>
  </div>

  <!-- SETUP SCREEN -->
  <div id="setupScreen" class="paper-card">
    <div class="spiral" id="spirals"></div>
    <div class="setup-section">
      <h2>Generate Question Paper</h2>
      <p>Total Marks: 30 · Duration: 30 Minutes · Custom Syllabus</p>

      <div style="margin-bottom:20px;">
        <label>Subject</label>
        <select id="subjectSel" class="input-field" onchange="renderChapters()">
          <option value="">-- Select Subject --</option>
        </select>
      </div>

      <div style="margin-bottom:25px;">
        <label id="chapterLabel">Chapters to Include</label>
        <div id="chapterList" class="chapters-scroll">
          <div style="color:#999; text-align:center; padding:20px;">Please select a subject first.</div>
        </div>
      </div>

      <button id="genBtn" class="btn-primary" onclick="generateExam()">Generate Paper</button>
      <div id="statusLog"></div>
    </div>
  </div>

  <!-- EXAM SCREEN (Question Container) -->
  <div id="examScreen" class="paper-card hidden">
    <div class="spiral"></div>
    <div id="examContent"></div>
    <div style="text-align:center; padding-top:20px;">
        <button class="btn-primary" onclick="submitExam()">Submit Paper</button>
    </div>
  </div>

  <!-- RESULTS SCREEN -->
  <div id="resultScreen" class="paper-card hidden">
    <div class="spiral"></div>
    <div id="scoreDisplay" style="text-align:center; padding:40px; background:var(--leaf); color:white; border-radius:20px;">
        <h2 id="finalScore" style="font-size:60px; margin:0;">0/30</h2>
    </div>
    <button class="btn-primary" style="width:100%; margin-top:20px;" onclick="location.reload()">Start New</button>
  </div>
</div>

<script>
const SUBJECTS = {
  "English": {
    book: "Inspire Course Book 6 / New Grammar Way 6",
    groups: {
      "Reader — Inspire Course Book 6": [
        "Relationships – The Personality of Siblings","Worlds Away From Home (includes Poem: Playthings)","The Race (includes Poem: The Echoing Green)",
        "A Life on Our Planet","The Lady with the Lamp (includes Poem: The Heart of a Bird)","Anne's Confessions","A New Superhero","Dusk",
        "A Lesson of Mercy","The Kitemaker (includes Poem: The Earthen Pot and the Iron Pot)"
      ],
      "Grammar — New Grammar Way 6": [
        "Nouns","Singular and Plural Nouns","Gender","Case","Verbs",
        "Auxiliary Verbs, Including Modals","Subject and Predicate","The Tense",
        "Simple Tenses","Continuous Tenses","Perfect Tenses","Active and Passive Voice",
        "Sentence and Its Kinds","Short Forms - Contractions","Interjections"
      ]
    }
  },
  "Hindi": {
    book: "Pratham Hindi Pathyapustak 6 / Pratham Hindi Vyakaran 6",
    groups: {
      "Reader — Pratham Hindi Pathyapustak 6": [
        "चिड़िया और चुरुन्गुन","धनवर्षण","अनारको का सातवाँ दिन","बैसाखी फिर आ गई","गौरा",
        "अनोखा बदला","चेतक की वीरता","हमारी भी सुनो","सादगी का मूल्य","सूरज का निमंत्रण",
        "रहीम के दोहे","सच्चा तीर्थ","पेड़ की बात"
      ],
      "Grammar — Pratham Hindi Vyakaran 6": [
        "भाषा, लिपि और व्याकरण","वर्ण विचार","शब्द विचार","संज्ञा","लिंग","वचन","कारक",
        "सर्वनाम","विशेषण","क्रिया","काल","अव्यय / अविकारी शब्द","संधि","समास",
        "उपसर्ग और प्रत्यय","पर्यायवाची, विलोम एवं अनेकार्थी शब्द","वाक्य विचार",
        "मुहावरे और लोकोक्तियाँ","अशुद्धि शोधन","पत्र लेखन एवं निबंध लेखन"
      ]
    }
  },
  "Mathematics": {
    book: "SMART Minds Mathematics 6",
    groups: {
      "Chapters": [
        "Patterns in Mathematics","Lines and Angles","Number Play",
        "Data Handling and Presentation","Prime Time","Perimeter and Area",
        "Fractions","Playing with Constructions","Symmetry","The Other Side of Zero"
      ]
    }
  },
  "Science": {
    book: "SURE Science 6",
    groups: {
      "Chapters": [
        "The Wonderful World of Science","Diversity in the Living World",
        "Mindful Eating: A Path to a Healthy Body","Exploring Magnets",
        "Measurement of Length and Motion","Materials Around Us",
        "Temperature and its Measurement","A Journey through States of Water",
        "Methods of Separation in Everyday Life","Living Creatures: Exploring their Characteristics",
        "Nature's Treasures","Beyond Earth"
      ]
    }
  },
  "Social Science": {
    book: "Society & Beyond 6",
    groups: {
      "Chapters": [
        "Locating Places on the Earth","Oceans and Continents","Landforms and Life",
        "Timeline of History and Its Sources","Bharat, That Is India",
        "The Beginning of Indian Civilization","India's Cultural Roots",
        "Unity in Diversity","Family and Community","Basic Democracy — Governance",
        "Local Government — Rural Areas","Local Government — Urban Areas",
        "Importance of Work","Economic Activities Around Us"
      ]
    }
  },
  "Sanskrit": {
    book: "Pratham Sanskrit 6",
    groups: {
      "Chapters": [
        "प्रार्थना (Prarthana)","संस्कृत-वर्णमाला (Sanskrit Varnamala)",
        "शब्द-परिचयः (अकारान्त-पुल्लिङ्ग-शब्दाः)","शब्द-परिचयः (आकारान्त-स्त्रीलिङ्ग-शब्दाः)",
        "शब्द-परिचयः (अकारान्त-नपुंसकलिङ्ग-शब्दाः)","धातु-परिचयः (क्रिया)",
        "प्रथमः पुरुषः (त्रिषु लिङ्गेषु)","मध्यमः पुरुषः (उभयलिङ्गेषु)","उत्तमः पुरुषः (उभयलिङ्गेषु)"
      ]
    }
  },
  "Computer / Information Technology": {
    book: "Skill Gate 6",
    groups: {
      "Chapters": [
        "Advanced Concepts in Excel","Pencil2D - Animation Software",
        "Introduction to Python Programming","Advanced HTML and Web Designing",
        "Cloud Computing and Google Apps","Cyber Security, Digital Citizenship, and Ethics",
        "Introduction to App Development","Artificial Intelligence (AI) and Machine Learning Basics"
      ]
    }
  },
  "General Knowledge / General Awareness": { book: null, groups: null, freeText: true },
  "Art / Work Education": { book: null, groups: null, freeText: true },
  "Physical Education / Sports": { book: null, groups: null, freeText: true },
  "Value Education / Life Skills": { book: null, groups: null, freeText: true }
};

let examData = [];
let userAnswers = {};

function saveKey() {
  localStorage.setItem('class6_api_key', document.getElementById('apiKey').value);
  alert("Key Saved.");
}

window.onload = () => {
  const k = localStorage.getItem('class6_api_key');
  if(k) document.getElementById('apiKey').value = k;
  const sel = document.getElementById('subjectSel');
  Object.keys(SUBJECTS).forEach(s => sel.innerHTML += `<option value="${s}">${s}</option>`);
  document.querySelectorAll('.spiral').forEach(sp => { for(let i=0;i<12;i++) sp.innerHTML += '<b></b>'; });
};

function renderChapters() {
  const subKey = document.getElementById('subjectSel').value;
  const list = document.getElementById('chapterList');
  list.innerHTML = "";
  if(!subKey) return;
  const subData = SUBJECTS[subKey];
  if(subData.freeText) {
    list.innerHTML = `<textarea id="freeText" class="input-field" rows="3" placeholder="Enter topics..."></textarea>`;
    return;
  }
  Object.keys(subData.groups).forEach(g => {
    list.innerHTML += `<div class="group-title">${g}</div>`;
    subData.groups[g].forEach(ch => {
      list.innerHTML += `<label class="ch-item"><input type="checkbox" class="ch-tick" value="${ch}"> ${ch}</label>`;
    });
  });
}

async function generateExam() {
  const apiKey = document.getElementById('apiKey').value;
  const subKey = document.getElementById('subjectSel').value;
  const model = document.getElementById('modelSelect').value;
  const log = document.getElementById('statusLog');
  const btn = document.getElementById('genBtn');
  
  let chs = Array.from(document.querySelectorAll('.ch-tick:checked')).map(t => t.value);
  if(SUBJECTS[subKey].freeText) chs = [document.getElementById('freeText').value];

  if(!apiKey || !subKey || chs.length === 0) return alert("Fill all fields.");

  btn.disabled = true;
  log.innerHTML = "Teacher is writing paper...";

  const prompt = `Create a 30-mark Class 6 ${subKey} exam. Chapters: ${chs.join(", ")}. Exactly 30 marks total. Break it into 15+ questions. Format: JSON array of objects with id, type (mcq/text), question, answer, marks, options (for mcq).`;

  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ contents: [{parts: [{text: prompt}]}] })
    });

    if (!res.ok) {
        // CATCH RAW SERVER ERROR
        const errJson = await res.json();
        throw new Error(JSON.stringify(errJson));
    }

    const data = await res.json();
    const text = data.candidates[0].content.parts[0].text;
    // Basic JSON clean up
    const cleanJson = text.replace(/```json/g, "").replace(/```/g, "").trim();
    examData = JSON.parse(cleanJson);
    startExam();
  } catch (e) {
    console.error(e);
    log.innerHTML = `<div class="error-box"><b>RAW ERROR FROM GOOGLE:</b><br>${e.message}</div>`;
    btn.disabled = false;
  }
}

function startExam() {
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('examScreen').classList.remove('hidden');
    const cont = document.getElementById('examContent');
    cont.innerHTML = "";
    examData.forEach((q, i) => {
        cont.innerHTML += `<div style="margin-bottom:20px;"><b>Q${i+1}. ${q.question}</b> (${q.marks}M)<br>
        <input type="text" class="input-field" oninput="userAnswers[${q.id}]=this.value"></div>`;
    });
}

function submitExam() {
    document.getElementById('examScreen').classList.add('hidden');
    document.getElementById('resultScreen').classList.remove('hidden');
    // Simplified score logic
    document.getElementById('finalScore').innerText = "Paper Submitted";
}
</script>
</body>
</html>
