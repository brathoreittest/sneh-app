<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 6 Practice Exam Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6E9;
    --paper-line:#DCE3CF;
    --board:#20463A;
    --board-dark:#163329;
    --ink:#2B3A4A;
    --marker-red:#D6493C;
    --pencil-yellow:#F2B705;
    --leaf:#4C8B6B;
    --leaf-light:#D9EEDF;
    --paper-shadow: 0 18px 40px -18px rgba(32,70,58,0.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; height: 100%;}
  body{
    background: var(--board);
    background-image: radial-gradient(circle at 10% 15%, rgba(255,255,255,0.035) 0, transparent 40%);
    font-family:'Inter', sans-serif;
    color:var(--ink);
    padding: 20px 15px;
  }
  .wrap{max-width:900px; margin:0 auto;}

  /* Header Section */
  .header{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:20px; flex-wrap:wrap; gap:15px;
  }
  .brand{ color:#fff; font-size:24px; font-weight:800; font-family:'Baloo 2'; }
  .brand span{ font-family:'Caveat'; color:var(--pencil-yellow); font-size:30px; }
  
  .api-settings{
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
    padding: 10px; border-radius: 12px; display: flex; gap: 8px; align-items: center;
  }
  .api-settings input, .api-settings select{
    background: #163329; color: #fff; border: 1px solid #4C8B6B;
    padding: 6px; border-radius: 6px; font-size: 12px; outline: none;
  }
  .btn-save{ background: var(--pencil-yellow); border:none; padding:6px 12px; border-radius:6px; font-weight:700; cursor:pointer; }

  /* Notebook Styles */
  .notebook{
    background:var(--paper); border-radius:20px; box-shadow:var(--paper-shadow);
    padding: 40px 40px 40px 65px; position:relative; min-height: 600px;
    background-image: repeating-linear-gradient(to bottom, transparent, transparent 34px, var(--paper-line) 35px);
    background-position: 0 100px;
  }
  .notebook::before{
    content:""; position:absolute; left:45px; top:0; bottom:0; width:2px; background: rgba(214,73,60,0.25);
  }
  .spiral{
    position:absolute; left:12px; top:30px; bottom:30px; width:20px;
    display:flex; flex-direction:column; justify-content:space-around;
  }
  .spiral b{ width:22px; height:22px; background:var(--board-dark); border-radius:50%; box-shadow: inset 0 0 0 6px var(--paper); }

  /* Setup Screen */
  .setup-title{ font-family:'Baloo 2'; color:var(--board-dark); font-size:28px; margin:0; }
  .setup-sub{ color:#666; font-size:14px; margin-bottom:25px; }
  
  .form-group{ margin-bottom:20px; }
  label{ display:block; font-weight:700; font-size:13px; color:var(--board-dark); margin-bottom:8px; text-transform:uppercase; }
  .styled-input{ width:100%; padding:12px; border-radius:10px; border:2px solid #DCE3CF; font-size:15px; outline:none; background:white; }
  
  .chapters-container{
    background:white; border:2px solid #DCE3CF; border-radius:10px; padding:15px;
    max-height:220px; overflow-y:auto; margin-top:10px;
  }
  .ch-row{ display:flex; align-items:center; gap:10px; padding:6px 0; border-bottom:1px solid #f2f2f2; }
  .ch-row input{ width:18px; height:18px; cursor:pointer; }

  .btn-gen{
    background:var(--marker-red); color:white; border:none; padding:16px 32px; 
    border-radius:14px; font-size:18px; font-weight:800; cursor:pointer;
    box-shadow: 0 5px 0 #9e3228; transition:0.2s; font-family:'Baloo 2';
  }
  .btn-gen:active{ transform:translateY(3px); box-shadow:none; }
  .btn-gen:disabled{ background:#999; box-shadow:none; cursor:not-allowed; }

  /* Exam Interface */
  .exam-meta{ display:flex; justify-content:space-between; align-items:center; border-bottom:2px dashed #DCE3CF; padding-bottom:15px; margin-bottom:25px; }
  .timer-box{ background:var(--board-dark); color:white; padding:8px 20px; border-radius:30px; font-family:'Baloo 2'; font-size:22px; }
  
  .q-card{ background:white; border:1px solid #e0e0e0; border-radius:15px; padding:25px; margin-bottom:20px; position:relative; }
  .q-card.active{ border: 2px solid var(--leaf); box-shadow: 0 0 15px rgba(76,139,107,0.1); }
  .q-head{ display:flex; justify-content:space-between; margin-bottom:15px; }
  .q-mark{ background:var(--leaf-light); padding:3px 12px; border-radius:12px; font-size:12px; font-weight:700; color:var(--leaf); }
  .q-text{ font-size:17px; font-weight:600; line-height:1.6; margin-bottom:20px; }
  
  .opt-list{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .opt-item{ 
    border:1px solid #ddd; padding:12px; border-radius:10px; cursor:pointer; 
    display:flex; align-items:center; gap:10px; transition: 0.2s;
  }
  .opt-item:hover{ background:#f8fdfa; border-color:var(--leaf); }
  .text-box{ width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; font-size:15px; }

  /* Scoring */
  .result-banner{ background:var(--leaf); color:white; padding:30px; border-radius:15px; text-align:center; margin-bottom:30px; }
  .score-circle{ font-size:54px; font-weight:800; font-family:'Baloo 2'; }
  .res-detail{ border-bottom:1px solid #eee; padding:15px 0; }
  .status-tag{ font-weight:800; padding:2px 8px; border-radius:5px; font-size:12px; }
  .tag-correct{ background:#d4edda; color:#155724; }
  .tag-wrong{ background:#f8d7da; color:#721c24; }

  .hidden{ display:none; }
  .loading-spinner { border: 4px solid rgba(0,0,0,0.1); border-left-color: var(--marker-red); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px;}
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="wrap">
  <header class="header">
    <div class="brand"><span>Class 6</span> ExamPro</div>
    <div class="api-settings">
      <input type="password" id="apiKey" placeholder="Gemini API Key">
      <select id="modelSelect">
        <option value="gemini-2.0-flash">Gemini 2.0 Flash (Fastest)</option>
        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
        <option value="gemini-1.5-pro">Gemini 1.5 Pro (Deepest)</option>
      </select>
      <button class="btn-save" onclick="saveConfig()">Save</button>
    </div>
  </header>

  <!-- SETUP SCREEN -->
  <div id="setupScreen" class="notebook">
    <div class="spiral"></div>
    <h2 class="setup-title">Generate Practice Paper</h2>
    <p class="setup-sub">Choose a subject to create a custom 30-mark exam based on your syllabus.</p>

    <div class="form-group">
      <label>Subject</label>
      <select id="subjectId" class="styled-input" onchange="updateChapters()">
        <option value="">-- Select Subject --</option>
        <option value="Mathematics">Mathematics</option>
        <option value="Science">Science</option>
        <option value="English">English</option>
        <option value="Social Science">Social Science</option>
        <option value="Hindi">Hindi</option>
        <option value="Computer Science">Computer Science</option>
      </select>
    </div>

    <div class="form-group">
      <label>Include Chapters</label>
      <div id="chapterBox" class="chapters-container">
        <div style="color:#999; padding:20px; text-align:center;">Select a subject to view chapters...</div>
      </div>
    </div>

    <button id="genBtn" class="btn-gen" onclick="generatePaper()">Generate 30-Mark Exam</button>
    <div id="status" style="margin-top:15px; font-weight:600;"></div>
  </div>

  <!-- EXAM SCREEN -->
  <div id="examScreen" class="notebook hidden">
    <div class="spiral"></div>
    <div class="exam-meta">
      <div>
        <h2 id="examSubjectDisplay" style="margin:0; font-family:'Baloo 2';">Subject</h2>
        <span style="font-size:13px; color:#666;">Class 6 Practice Paper · 30 Marks</span>
      </div>
      <div id="timer" class="timer-box">30:00</div>
    </div>

    <div id="questionList"></div>

    <div style="text-align:center; padding-top:30px;">
      <button class="btn-gen" onclick="endExam()">Submit Examination</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div id="resultScreen" class="notebook hidden">
    <div class="spiral"></div>
    <div class="result-banner">
      <div style="font-size:18px;">Total Score</div>
      <div class="score-circle" id="finalScore">0/30</div>
    </div>
    <div id="resultSummary"></div>
    <button class="btn-gen" style="margin-top:20px; width:100%;" onclick="location.reload()">Take Another Test</button>
  </div>

</div>

<script>
const SYLLABUS = {
  "Mathematics": ["Number Play", "Fractions", "Decimals", "Data Handling", "Mensuration (Perimeter & Area)", "Algebra Intro", "Ratio & Proportion", "Lines and Angles", "Prime Time"],
  "Science": ["Food & Components", "Sorting Materials", "Separation of Substances", "Getting to Know Plants", "Body Movements", "Motion & Measurement", "Light & Shadows", "Electricity", "Magnets"],
  "English": ["Reading Comprehension", "Nouns & Pronouns", "Tenses", "Adjectives", "Active/Passive Voice", "Determiners", "Paragraph Writing"],
  "Social Science": ["Earth in Solar System", "Maps", "Major Landforms", "Indus Valley Civilization", "Vedic Age", "Local Government", "Democracy"],
  "Hindi": ["चिड़िया और चुरुन्गुन", "गौरा", "विशेषण", "मुहावरे", "संज्ञा", "लिंग और वचन"],
  "Computer Science": ["Advanced Excel", "Python Basics", "HTML Tags", "Cyber Safety", "AI Basics", "Cloud Apps"]
};

let questions = [];
let answers = {};
let secondsLeft = 1800;
let timerId;

// --- Persistence ---
function saveConfig() {
  localStorage.setItem('gemini_key', document.getElementById('apiKey').value);
  localStorage.setItem('gemini_model', document.getElementById('modelSelect').value);
  alert("Settings Saved!");
}

function loadConfig() {
  const k = localStorage.getItem('gemini_key');
  const m = localStorage.getItem('gemini_model');
  if(k) document.getElementById('apiKey').value = k;
  if(m) document.getElementById('modelSelect').value = m;
  
  // Build spirals
  document.querySelectorAll('.spiral').forEach(s => {
    for(let i=0; i<12; i++) s.innerHTML += '<b></b>';
  });
}
loadConfig();

// --- UI Logic ---
function updateChapters() {
  const sub = document.getElementById('subjectId').value;
  const box = document.getElementById('chapterBox');
  box.innerHTML = "";
  if(!sub) return;

  SYLLABUS[sub].forEach(ch => {
    box.innerHTML += `<div class="ch-row"><input type="checkbox" class="ch-tick" value="${ch}"> <span>${ch}</span></div>`;
  });
}

// --- API Logic (Fixed for Multiple Questions) ---
async function generatePaper() {
  const key = document.getElementById('apiKey').value;
  const sub = document.getElementById('subjectId').value;
  const model = document.getElementById('modelSelect').value;
  const selected = Array.from(document.querySelectorAll('.ch-tick:checked')).map(t => t.value);

  if(!key) return alert("Please enter your API Key");
  if(!sub || selected.length === 0) return alert("Please select subject and chapters");

  const btn = document.getElementById('genBtn');
  const status = document.getElementById('status');
  btn.disabled = true;
  status.innerHTML = `<span class="loading-spinner"></span> Generating 30-Mark paper for ${sub}...`;

  const prompt = `
    Create a Class 6 school practice exam for the subject "${sub}". 
    Topic focus: ${selected.join(", ")}.
    
    PAPER RULES:
    1. Total marks MUST be exactly 30.
    2. QUESTION COUNT: You MUST create at least 12 distinct questions. Do not combine everything into one question.
    3. DISTRIBUTION:
       - Part A: 10 MCQs (1 mark each)
       - Part B: 5 Fill in the blanks or One-word answers (1 mark each)
       - Part C: 3 Short Answers (3 marks each)
       - Part D: 1 Long Answer (6 marks)
    4. MATH: Use text notation (e.g. 1/2, 5^2, area = l x b).
    5. No markdown. Return ONLY a valid JSON array.

    JSON SCHEMA:
    [
      {"id": 1, "type": "mcq", "question": "...", "options": ["A", "B", "C", "D"], "answer": "...", "marks": 1},
      {"id": 2, "type": "text", "question": "...", "answer": "...", "marks": 1},
      {"id": 3, "type": "descriptive", "question": "...", "answer": "Model answer for student to compare", "marks": 3}
    ]
  `;

  try {
    const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        contents: [{parts: [{text: prompt}]}],
        generationConfig: { responseMimeType: "application/json", temperature: 0.7 }
      })
    });

    const data = await resp.json();
    const text = data.candidates[0].content.parts[0].text;
    questions = JSON.parse(text);
    
    startExam(sub);
  } catch (e) {
    console.error(e);
    status.innerHTML = "Error generating paper. Please check API Key or try again.";
    btn.disabled = false;
  }
}

// --- Exam Session ---
function startExam(sub) {
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('examScreen').classList.remove('hidden');
  document.getElementById('examSubjectDisplay').innerText = sub;
  
  const container = document.getElementById('questionList');
  container.innerHTML = "";

  questions.forEach((q, idx) => {
    const card = document.createElement('div');
    card.className = "q-card";
    card.innerHTML = `
      <div class="q-head">
        <span style="font-weight:800; color:var(--leaf)">Question ${idx+1}</span>
        <span class="q-mark">${q.marks} Mark${q.marks>1?'s':''}</span>
      </div>
      <div class="q-text">${q.question}</div>
      <div id="input-area-${q.id}"></div>
    `;
    container.appendChild(card);

    const inputArea = document.getElementById(`input-area-${q.id}`);
    if(q.type === 'mcq') {
      const opts = document.createElement('div');
      opts.className = "opt-list";
      q.options.forEach(o => {
        opts.innerHTML += `
          <label class="opt-item">
            <input type="radio" name="q-${q.id}" value="${o}" onchange="saveAns(${q.id}, '${o}')">
            ${o}
          </label>
        `;
      });
      inputArea.appendChild(opts);
    } else if(q.type === 'text') {
      inputArea.innerHTML = `<input type="text" class="text-box" placeholder="Your answer..." oninput="saveAns(${q.id}, this.value)">`;
    } else {
      inputArea.innerHTML = `<textarea class="text-box" rows="3" placeholder="Explain your answer..." oninput="saveAns(${q.id}, this.value)"></textarea>`;
    }
  });

  timerId = setInterval(updateTimer, 1000);
}

function saveAns(qid, val) { answers[qid] = val; }

function updateTimer() {
  secondsLeft--;
  const m = Math.floor(secondsLeft/60);
  const s = secondsLeft % 60;
  document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
  if(secondsLeft <= 0) endExam();
}

// --- Grading ---
function endExam() {
  clearInterval(timerId);
  document.getElementById('examScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');

  let totalScore = 0;
  let maxMarks = 0;
  const summary = document.getElementById('resultSummary');
  summary.innerHTML = "";

  questions.forEach(q => {
    maxMarks += q.marks;
    const userAns = (answers[q.id] || "").trim().toLowerCase();
    const correctAns = String(q.answer).trim().toLowerCase();
    
    let isCorrect = false;
    if(q.type !== 'descriptive') {
      if(userAns === correctAns) {
        totalScore += q.marks;
        isCorrect = true;
      }
    } else {
      // For descriptive in a simple app, we award marks if they wrote a reasonable amount
      if(userAns.length > 15) {
        totalScore += q.marks;
        isCorrect = true;
      }
    }

    summary.innerHTML += `
      <div class="res-detail">
        <div style="display:flex; justify-content:space-between;">
          <span style="font-weight:700;">Q: ${q.question}</span>
          <span class="status-tag ${isCorrect ? 'tag-correct' : 'tag-wrong'}">${isCorrect ? 'Correct' : 'Incorrect'}</span>
        </div>
        <div style="font-size:14px; margin-top:5px;">
          Your Answer: <span style="color:#666">${answers[q.id] || "No response"}</span><br>
          Correct Answer: <span style="color:var(--leaf)">${q.answer}</span>
        </div>
      </div>
    `;
  });

  document.getElementById('finalScore').innerText = `${totalScore} / ${maxMarks}`;
}

</script>
</body>
</html>
